<style>

<script>
'use strict';
/*
 * Prism loading animation — a faithful standalone recreation of the vgpu.sh
 * hero (ported WebGPU/WGSL -> WebGL2/GLSL), mirrored so the white beam enters
 * from the LEFT and the spectrum exits RIGHT.
 *
 * Physical model (values match the original source):
 *  - Equilateral prism cross-section, circumradius 0.57/sqrt(3), extruded
 *    z = 0.015 .. 0.315, beveled edges.
 *  - Glass: IOR 1.645, Beer-Lambert absorption (1, 1, 0.54)/unit,
 *    Schlick Fresnel F0 = ((n-1)/(n+1))^2, env reflection strength 2.14.
 *  - Spectral beam: 128 wavelengths 400..700nm, 24 beam slices, Cauchy-style
 *    dispersion n(l) = 1.245 + 0.06/(l um)^2, up to 3 TIR bounces,
 *    per-interface Fresnel transmission, CIE-approx wavelength->RGB.
 *  - HDR pipeline: linear scene -> threshold bloom pyramid -> ACES -> sRGB,
 *    volumetric dust lit by the unthresholded low-frequency light field.
 *  - Reveal: opacity eases in over 1s, beam aperture opens over 2.5s.
 */

// ---------------------------------------------------------------------------
// Constants (from the original prism-background source)
// ---------------------------------------------------------------------------
const CAMERA_DISTANCE = 1.25;
const CAMERA_FOV = 48;
const CAMERA_ORBIT_DEGREES = 20;
const CAMERA_ORBIT_LERP = 0.08;
const LAMP_AIM_LERP = 0.12;
const PRISM_SCALE = 0.4;                 // 20% smaller again (was 0.5)
const PRISM_FRONT_Z = 0.315 * PRISM_SCALE;
const PRISM_BACK_Z = 0.015 * PRISM_SCALE;
const PRISM_LIGHT_PLANE_Z = 0.165 * PRISM_SCALE;
const PRISM_MAX_INTERNAL_BOUNCES = 3;
const PRISM_SPECTRAL_SAMPLES = 128;
const PRISM_BEAM_SLICES = 24;
const PRISM_LIGHT_EXPOSURE = 88;
const WAVELENGTH_MIN = 400, WAVELENGTH_MAX = 700;
const DISPERSION = { base: 1.245, strength: 0.088 };   // "stylized" preset (settled state)
// Animated copy: the intro ramps `strength` from near zero (tight white exit
// ray) up to the preset (full VIBGYOR fan). `base` is compensated so the
// central 550nm ray keeps a constant IOR and the fan opens around it.
const dispersionRuntime = { base: DISPERSION.base, strength: DISPERSION.strength };
const IOR_AT_550_TERM = 1 / (0.55 * 0.55);
function setDispersionProgress(mix) {
  const strength = 0.004 + (DISPERSION.strength - 0.004) * clamp(mix, 0, 1);
  dispersionRuntime.strength = strength;
  dispersionRuntime.base = DISPERSION.base + (DISPERSION.strength - strength) * IOR_AT_550_TERM;
}
const GLASS = {
  ior: 1.645,
  absorption: [1, 1, 0.54],
  reflectionStrength: 2.14,
  environmentExposure: 2.3,
};
const LIGHT_FADE = {
  beamOpacity: 1, edgeFalloff: 16,
  rainbowFalloffRate: 3.8, rainbowFalloffPower: 3.7,
};
const BEAM_WIDTH = 0.025 * PRISM_SCALE;
const BEAM_MOUSE_Y = { top: -35, bottom: 75 };
const MIDPOINT_INCIDENCE = 60;
const BLOOM_LEVELS = 4;
const BLOOM_DIVISORS = [2, 4, 8, 16];
const BLOOM_KERNEL_TAPS = [6, 10, 14, 18];
const BLOOM_LEVEL_FACTORS = [1, 0.8, 0.55];
const BLOOM = { strength: 0.7, threshold: 0.1, radius: 0.25 };
const ENV_SIZE = [1024, 512];
const DUST_COUNT = 950;
const AMBIENT_COUNT = 1800;  // extra faint self-lit specks in the surroundings

// Equilateral triangle, circumradius 0.57/sqrt(3), apex up, centered at 0.
const TRI = (() => {
  const R = 0.57 * PRISM_SCALE / Math.sqrt(3);
  const at = (deg) => {
    const a = deg * Math.PI / 180;
    return [R * Math.cos(a), R * Math.sin(a)];
  };
  return { a: at(90), b: at(210), c: at(330) };
})();

// ---------------------------------------------------------------------------
// Small vector helpers
// ---------------------------------------------------------------------------
const add2 = (a, b) => [a[0] + b[0], a[1] + b[1]];
const sub2 = (a, b) => [a[0] - b[0], a[1] - b[1]];
const mul2 = (a, s) => [a[0] * s, a[1] * s];
const dot2 = (a, b) => a[0] * b[0] + a[1] * b[1];
const cross2 = (a, b) => a[0] * b[1] - a[1] * b[0];
const norm2 = (a) => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; };
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const rad = (d) => d * Math.PI / 180;
const rot2 = (v, a) => {
  const c = Math.cos(a), s = Math.sin(a);
  return [v[0] * c - v[1] * s, v[0] * s + v[1] * c];
};

// ---------------------------------------------------------------------------
// 2D prism optics (CPU spectral ray tracer)
// ---------------------------------------------------------------------------
function intersectTriangle(tri, origin, dir, minT) {
  const pts = [tri.a, tri.b, tri.c];
  let best;
  for (let i = 0; i < 3; i++) {
    const p = pts[i];
    const edge = sub2(pts[(i + 1) % 3], p);
    const den = cross2(dir, edge);
    if (den === 0) continue;
    const diff = sub2(p, origin);
    const t = cross2(diff, edge) / den;
    const u = cross2(diff, dir) / den;
    if (t <= minT || u < 0 || u > 1) continue;
    if (best && best.t <= t) continue;
    best = { t, normal: norm2([edge[1], -edge[0]]), edge: i };
  }
  return best;
}

function refract2(incident, normal, eta) {
  const cosI = -dot2(incident, normal);
  const k = eta * eta * (1 - cosI * cosI);
  if (k > 1) return undefined;                       // total internal reflection
  const cosT = Math.sqrt(1 - k);
  return add2(mul2(incident, eta), mul2(normal, eta * cosI - cosT));
}

function fresnelTransmission(incident, normal, n1, n2) {
  const cosI = clamp(-dot2(incident, normal), 0, 1);
  const r = n1 / n2;
  const k = r * r * (1 - cosI * cosI);
  if (k >= 1) return 0;
  const cosT = Math.sqrt(1 - k);
  const rs = (n1 * cosI - n2 * cosT) / (n1 * cosI + n2 * cosT);
  const rp = (n1 * cosT - n2 * cosI) / (n1 * cosT + n2 * cosI);
  return 1 - 0.5 * (rs * rs + rp * rp);
}

const iorAt = (nm, base, strength) => {
  const um = 0.001 * nm;
  return base + strength / (um * um);
};

function tracePrismDetailed(tri, origin, dir, ior, maxBounces = PRISM_MAX_INTERNAL_BOUNCES) {
  const entry = intersectTriangle(tri, origin, dir, 1e-4);
  if (!entry || dot2(dir, entry.normal) >= 0) return undefined;
  let p = add2(origin, mul2(dir, entry.t));
  let d = refract2(dir, entry.normal, 1 / ior);
  if (!d) return undefined;
  const points = [p], edges = [entry.edge];
  const entryTransmission = fresnelTransmission(dir, entry.normal, 1, ior);
  let transmission = entryTransmission;
  for (let bounce = 0; bounce <= maxBounces; bounce++) {
    const hit = intersectTriangle(tri, p, d, 1e-4);
    if (!hit) break;
    p = add2(p, mul2(d, hit.t));
    points.push(p);
    edges.push(hit.edge);
    const out = refract2(d, mul2(hit.normal, -1), ior);
    if (out) {
      transmission *= fresnelTransmission(d, mul2(hit.normal, -1), ior, 1);
      return {
        origin: p, direction: norm2(out), bounces: bounce,
        points, edges, transmission, entryTransmission,
      };
    }
    d = sub2(d, mul2(hit.normal, 2 * dot2(d, hit.normal)));
  }
  return undefined;
}

// CIE-fit wavelength -> beam RGB with luminous-efficiency shaping (original).
const CIE_Y = [
  82.7549, 91.486, 93.4318, 86.6823, 104.865, 117.008, 117.812, 114.861,
  115.923, 108.811, 109.354, 107.802, 104.79, 107.689, 104.405, 104.046,
  100, 96.3342, 95.788, 88.6856, 90.0062, 89.5991, 87.6987, 83.2886,
  83.6992, 80.0268, 80.2146, 82.2778, 78.2842, 69.7213, 71.6091,
];
function wavelengthToBeamRgb(nm) {
  const w = clamp(nm, WAVELENGTH_MIN, WAVELENGTH_MAX);
  const g = (c, m, sl, sr) => { const t = (w - m) * (w < m ? sl : sr); return c * Math.exp(-0.5 * t * t); };
  const X = g(0.362, 442, 0.0624, 0.0374) + g(1.056, 599.8, 0.0264, 0.0323) - g(0.065, 501.1, 0.049, 0.0382);
  const Y = g(0.821, 568.8, 0.0213, 0.0247) + g(0.286, 530.9, 0.0613, 0.0322);
  const Z = g(1.217, 437, 0.0845, 0.0278) + g(0.681, 459, 0.0385, 0.0725);
  const rgb = [
    3.2406 * X - 1.5372 * Y - 0.4986 * Z,
    -0.9689 * X + 1.8758 * Y + 0.0415 * Z,
    0.0557 * X - 0.204 * Y + 1.057 * Z,
  ];
  const mn = Math.min(0, ...rgb);
  const pos = rgb.map((v) => v - mn);
  const mx = Math.max(...pos, Number.EPSILON);
  const idx = clamp((w - WAVELENGTH_MIN) / 10, 0, CIE_Y.length - 1);
  const lo = Math.min(CIE_Y.length - 2, Math.floor(idx));
  const f = idx - lo;
  const lum = ((CIE_Y[lo] * (1 - f) + CIE_Y[lo + 1] * f) / 100) * Y / 1.0347;
  const gain = (1 - Math.exp(-4.5 * lum)) / (1 - Math.exp(-4.5));
  // Short-wavelength lift: the photopic gain crushes violet to near-black,
  // collapsing the fan's end into one flat blue. Cameras (and the reference)
  // keep indigo/violet visible, so lift 400-480nm progressively — the violet
  // keeps its red-tinged hue from the CIE X lobe, now bright enough to read.
  // Taper the extreme short-wavelength tail to nothing so the fan ends in a
  // soft violet fade instead of a detached stray blue line at the edge.
  const tRaw = clamp((w - 405) / 35, 0, 1);
  const tailFade = tRaw * tRaw * (3 - 2 * tRaw);
  const violetBoost = (w < 480 ? 1 + 2.2 * Math.pow((480 - w) / 80, 1.15) : 1) * tailFade;
  return [pos[0] / mx * gain * 1.1868 * violetBoost,
          pos[1] / mx * gain * violetBoost,
          pos[2] / mx * gain * 1.65 * violetBoost];
}
const SPECTRAL_LUT = Array.from({ length: PRISM_SPECTRAL_SAMPLES }, (_, i) => {
  const wl = WAVELENGTH_MIN + (WAVELENGTH_MAX - WAVELENGTH_MIN) * i / (PRISM_SPECTRAL_SAMPLES - 1);
  return wavelengthToBeamRgb(wl);
});

// ---------------------------------------------------------------------------
// Lamp (collimated beam). Mirrored in X so it enters from the LEFT.
// ---------------------------------------------------------------------------
function lampForIncidence(incidenceDeg, beamWidth, target) {
  const edge = sub2(TRI.a, TRI.c);
  const len = Math.hypot(edge[0], edge[1]);
  const dir = rot2([-edge[1] / len, edge[0] / len], rad(-incidenceDeg));
  const margin = Math.min(0.45, beamWidth / (2 * len * Math.max(0.05, Math.abs(Math.cos(rad(incidenceDeg))))) + 1e-4);
  const t = clamp(clamp(target, margin, 1 - margin), 0, 1);
  const hitPoint = [TRI.a[0] + (TRI.c[0] - TRI.a[0]) * t, TRI.a[1] + (TRI.c[1] - TRI.a[1]) * t];
  const center = [hitPoint[0] - 6.5 * dir[0], hitPoint[1] - 6.5 * dir[1]];
  const d = norm2(sub2(hitPoint, center));
  // Mirror in X: triangle is symmetric about x=0, so this swaps entry face
  // A-C (right) for A-B (left) and the beam travels left -> right.
  return {
    center: [-center[0], center[1]],
    direction: [-d[0], d[1]],
    beamHalfWidth: 0.5 * beamWidth,
  };
}
function incidenceAt(arc) {
  const a = clamp(arc, 0, 1);
  return a <= 0.5
    ? BEAM_MOUSE_Y.top + (MIDPOINT_INCIDENCE - BEAM_MOUSE_Y.top) * a * 2
    : MIDPOINT_INCIDENCE + (BEAM_MOUSE_Y.bottom - MIDPOINT_INCIDENCE) * (a - 0.5) * 2;
}
const lampAt = (arc, target) => lampForIncidence(incidenceAt(arc), BEAM_WIDTH, target);

// ---------------------------------------------------------------------------
// Light-sheet mesh: white entry beam + per-wavelength internal strips +
// outgoing spectral fan. CPU-built; colors and metadata baked per-vertex.
// Layout: [x, y, r, g, b, intensity, profile, travel, revealProfile] (9 floats)
// ---------------------------------------------------------------------------
const LIGHT_SEGMENTS = PRISM_MAX_INTERNAL_BOUNCES + 1;
const LIGHT_WHITE_QUADS = PRISM_BEAM_SLICES;
const LIGHT_INTERNAL_QUADS = PRISM_SPECTRAL_SAMPLES * PRISM_BEAM_SLICES * LIGHT_SEGMENTS;
const LIGHT_OUTGOING_QUADS = (PRISM_SPECTRAL_SAMPLES - 1) * PRISM_BEAM_SLICES;
const LIGHT_TOTAL_QUADS = LIGHT_WHITE_QUADS + LIGHT_INTERNAL_QUADS + LIGHT_OUTGOING_QUADS;
const LIGHT_STRIDE = 10; // + pathT: 0..1 white approach, 1..2 inside glass, 2..3 outgoing fan
const BOUNDARY_PROFILES = Array.from({ length: PRISM_BEAM_SLICES + 1 }, (_, i) => -1 + 2 * i / PRISM_BEAM_SLICES);
const QUAD_UPPER = [0, 1, 1, 0, 1, 0];
const QUAD_END_TRAVEL = [0, 0, 1, 0, 1, 1];

function lampOffset(light, profile) {
  const perp = [-light.direction[1], light.direction[0]];
  return add2(light.center, mul2(perp, light.beamHalfWidth * clamp(profile, -1, 1)));
}

function extendToWall(origin, dir, halfExtent) {
  let best = Infinity;
  for (let axis = 0; axis < 2; axis++) {
    const d = dir[axis];
    if (Math.abs(d) < 1e-8) continue;
    for (const bound of [-halfExtent[axis], halfExtent[axis]]) {
      const t = (bound - origin[axis]) / d;
      if (t <= 0 || t >= best) continue;
      const other = 1 - axis;
      if (Math.abs(origin[other] + dir[other] * t) <= halfExtent[other] + 1e-6) best = t;
    }
  }
  return Number.isFinite(best) ? add2(origin, mul2(dir, best)) : origin;
}

function segmentInWall(origin, dir, halfExtent) {
  let tMin = -Infinity, tMax = Infinity;
  for (let axis = 0; axis < 2; axis++) {
    const d = dir[axis], o = origin[axis], h = halfExtent[axis];
    if (Math.abs(d) < 1e-8) {
      if (Math.abs(o) > h) return undefined;
      continue;
    }
    const t0 = (-h - o) / d, t1 = (h - o) / d;
    tMin = Math.max(tMin, Math.min(t0, t1));
    tMax = Math.min(tMax, Math.max(t0, t1));
    if (tMin > tMax) return undefined;
  }
  tMin = Math.max(0, tMin);
  if (!Number.isFinite(tMin) || !Number.isFinite(tMax) || tMax < tMin) return undefined;
  return [add2(origin, mul2(dir, tMin)), add2(origin, mul2(dir, tMax))];
}

function beamClipsTriangle(tri, beam) {
  const perp = [-beam.direction[1], beam.direction[0]];
  let poly = [tri.a, tri.b, tri.c].map((p) => {
    const d = sub2(p, beam.center);
    return [dot2(d, beam.direction), dot2(d, perp)];
  });
  const clip = (fn) => {
    const prev = poly; poly = [];
    for (let i = 0; i < prev.length; i++) {
      const p = prev[i], q = prev[(i + 1) % prev.length];
      const dp = fn(p), dq = fn(q);
      if (dp >= 0) poly.push(p);
      if ((dp >= 0) !== (dq >= 0)) {
        const h = dp / (dp - dq);
        poly.push([p[0] + (q[0] - p[0]) * h, p[1] + (q[1] - p[1]) * h]);
      }
    }
  };
  clip((p) => p[0]);
  if (!poly.length) return false;
  clip((p) => p[1] + beam.beamHalfWidth);
  if (!poly.length) return false;
  clip((p) => beam.beamHalfWidth - p[1]);
  return poly.length > 0;
}

function samePath(a, b) {
  return a.edges.length === b.edges.length && a.edges.every((e, i) => e === b.edges[i]);
}

function buildLightMesh(light, wallHalfExtent, out) {
  const N = PRISM_SPECTRAL_SAMPLES, S = PRISM_BEAM_SLICES;
  const exposure = PRISM_LIGHT_EXPOSURE;
  const edgeFalloff = LIGHT_FADE.edgeFalloff;
  const beamWidthTotal = 2 * light.beamHalfWidth;
  let cursor = 0, quadIndex = 0;

  const pushQuad = (sL, sU, eL, eU, iStart, iEnd, tStart = 0, tEnd = 0) => {
    // Vertex order (startLower, startUpper, endUpper, startLower, endUpper, endLower)
    const q = quadIndex++;
    const verts = [[sL, iStart], [sU, iStart], [eU, iEnd], [sL, iStart], [eU, iEnd], [eL, iEnd]];
    for (let c = 0; c < 6; c++) {
      const [p, intensity] = verts[c];
      const upper = QUAD_UPPER[c];
      let colorR = 1, colorG = 1, colorB = 1;
      let profile = 0, travel = 0, revealProfile = 0;
      if (q < LIGHT_WHITE_QUADS) {
        profile = BOUNDARY_PROFILES[q + upper];
        revealProfile = profile;
      } else {
        const sq = q - LIGHT_WHITE_QUADS;
        let spectralIndex;
        if (sq < LIGHT_INTERNAL_QUADS) {
          const perWl = S * LIGHT_SEGMENTS;
          spectralIndex = Math.floor(sq / perWl);

const GLASS_COMMON = `
uniform mat4 uViewProjection;
uniform vec3 uCameraPosition;
uniform vec3 uAbsorption;
uniform float uIor;
uniform float uReflectionStrength;
uniform float uEnvironmentExposure;
uniform float uFresnelF0;
uniform vec4 uPrismPlanes[5];
uniform sampler2D uEnvironment;
const float PI = 3.141592653589793;
const float NO_HIT = 100000.0;
const float SURFACE_EPSILON = 0.0002;
vec2 equirectUv(vec3 direction) {
  vec3 d = normalize(direction);
  return vec2(atan(d.z, d.x) / (2.0 * PI) + 0.5, acos(clamp(d.y, -1.0, 1.0)) / PI);
}
const float ENV_TEXEL_ANGLE = ${(2 * Math.PI / ENV_SIZE[0]).toFixed(8)};
vec3 sampleEnvironment(vec3 direction) {
  // Prefiltered lookup: pick the mip whose texel footprint matches how fast
  // the reflection direction changes across this pixel (the original's
  // env_lod), so thin mirror highlights stay stable instead of shimmering.
  float footprint = max(length(dFdx(direction)), length(dFdy(direction)));
  float lod = clamp(log2(max(footprint, 1e-8) / ENV_TEXEL_ANGLE), 0.0, 7.0);
  vec2 size = vec2(${ENV_SIZE[0]}.0, ${ENV_SIZE[1]}.0);
  vec2 levelSize = max(size / exp2(lod), vec2(2.0));
  vec2 texel = equirectUv(direction) * levelSize - 0.5;
  vec2 corner = floor(texel);
  vec2 f = fract(texel);
  vec2 uv = (corner + f * f * (3.0 - 2.0 * f) + 0.5) / levelSize;
  return textureLod(uEnvironment, uv, lod).rgb * uEnvironmentExposure;
}
float dielectricFresnel(float f0, float facing) {
  float m = 1.0 - clamp(facing, 0.0, 1.0);
  float sq = m * m;
  return f0 + (1.0 - f0) * sq * sq * m;
}
float planeHitDistance(vec3 origin, vec3 direction, vec4 plane, float minT) {
  float den = dot(plane.xyz, direction);
  if (den <= 0.00001) return NO_HIT;
  float d = (plane.w - dot(plane.xyz, origin)) / den;
  return d > minT ? d : NO_HIT;
}
void nextSurface(vec3 origin, vec3 direction, float minT, out float outDist, out vec3 outNormal) {
  float nearest = planeHitDistance(origin, direction, uPrismPlanes[3], minT);
  vec3 normal = uPrismPlanes[3].xyz;
  float backD = planeHitDistance(origin, direction, uPrismPlanes[4], minT);
  if (backD < nearest) { nearest = backD; normal = uPrismPlanes[4].xyz; }
  for (int i = 0; i < 3; i++) {
    float d = planeHitDistance(origin, direction, uPrismPlanes[i], minT);
    if (d < nearest) { nearest = d; normal = uPrismPlanes[i].xyz; }
  }
  outDist = nearest;
  outNormal = normal;
}`;

const GLASS_BACK_FS = `#version 300 es

in vec3 vWorldNormal;

struct ExitPath { vec3 position; vec3 direction; vec3 incidentDirection; vec3 inwardNormal; bool escaped; };
ExitPath traceExit(vec3 firstPosition, vec3 firstDirection, vec3 firstInwardNormal) {
  vec3 position = firstPosition;
  vec3 direction = firstDirection;
  vec3 inwardNormal = firstInwardNormal;
  for (int bounce = 0; bounce <= 3; bounce++) {
    vec3 transmitted = refract(direction, inwardNormal, uIor);
    if (length(transmitted) > 0.00001)
      return ExitPath(position, normalize(transmitted), direction, inwardNormal, true);
    direction = normalize(reflect(direction, inwardNormal));
    float dist; vec3 normal;
    nextSurface(position + direction * SURFACE_EPSILON, direction, SURFACE_EPSILON, dist, normal);
    if (dist >= 10.0) break;
    position = position + direction * (dist + SURFACE_EPSILON);
    inwardNormal = -normal;
  }
  return ExitPath(position, direction, direction, inwardNormal, false);
}
ExitPath traceReflectedExit(vec3 surfacePosition, vec3 incidentDirection, vec3 inwardNormal) {
  vec3 direction = normalize(reflect(incidentDirection, inwardNormal));
  vec3 shifted = surfacePosition + direction * SURFACE_EPSILON;
  float dist; vec3 normal;
  nextSurface(shifted, direction, SURFACE_EPSILON, dist, normal);
  if (dist >= 10.0) return ExitPath(surfacePosition, direction, direction, inwardNormal, false);
  return traceExit(shifted + direction * dist, direction, -normal);
}

  vec3 view = normalize(uCameraPosition - vWorldPosition);
  vec3 incident = -view;
  vec3 inwardNormal = -normalize(vWorldNormal);
  ExitPath exitPath = traceExit(vWorldPosition, incident, inwardNormal);
  ExitPath reflected = traceReflectedExit(exitPath.position, exitPath.incidentDirection, exitPath.inwardNormal);
  float reflectedFacing = clamp(-dot(reflected.incidentDirection, reflected.inwardNormal), 0.0, 1.0);
  float reflectedExitTransmission = reflected.escaped
    ? 1.0 - dielectricFresnel(uFresnelF0, reflectedFacing) : 0.0;

    * uReflectionStrength * reflectedExitTransmission;

const LIGHT_FS = `#version 300 es

in vec3 vColor;
in float vIntensity;
in float vProfile;
in float vTravel;
in float vRevealProfile;
in float vPathT;
uniform float uEdgeFalloff;
uniform float uOpacity;
uniform float uRainbowFalloffRate;
uniform float uRainbowFalloffPower;
uniform float uBeamWidthReveal;
uniform float uSweep; // travelling light front, 0..3 along the path
out vec4 fragColor;
float beamWidthReveal(float profile, float progress) {

const BLOOM_EXTRACT_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSource;
uniform float uThreshold;
out vec4 fragColor;
void main() {
  // Karis-weighted 4-tap box over the supersampled source keeps the bloom
  // seed stable frame-to-frame (no shimmering halo from subpixel highlights).
  vec2 texel = 1.0 / vec2(textureSize(uSource, 0));
  vec3 c0 = max(textureLod(uSource, vUv + texel * vec2(-1.0, -1.0), 0.0).rgb, vec3(0.0));
  vec3 c1 = max(textureLod(uSource, vUv + texel * vec2( 1.0, -1.0), 0.0).rgb, vec3(0.0));
  vec3 c2 = max(textureLod(uSource, vUv + texel * vec2(-1.0,  1.0), 0.0).rgb, vec3(0.0));
  vec3 c3 = max(textureLod(uSource, vUv + texel * vec2( 1.0,  1.0), 0.0).rgb, vec3(0.0));
  float k0 = 1.0 / (1.0 + max(max(c0.r, c0.g), c0.b));
  float k1 = 1.0 / (1.0 + max(max(c1.r, c1.g), c1.b));
  float k2 = 1.0 / (1.0 + max(max(c2.r, c2.g), c2.b));
  float k3 = 1.0 / (1.0 + max(max(c3.r, c3.g), c3.b));
  vec3 color = (c0 * k0 + c1 * k1 + c2 * k2 + c3 * k3) / (k0 + k1 + k2 + k3);
  float brightness = max(max(color.r, color.g), color.b);
  float threshold = max(uThreshold, 0.0);
  float knee = max(threshold * 0.5, 0.0001);
  float soft = clamp(brightness - threshold + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee + 0.0001);
  float contribution = max(brightness - threshold, soft) / max(brightness, 0.0001);
  fragColor = vec4(color * contribution, 1.0);
}`;

const BLOOM_BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uSource;
uniform vec2 uDirection;
uniform vec2 uTexelSize;
uniform float uTapCount;
uniform float uCoefficients[24];
out vec4 fragColor;
void main() {
  vec3 color = textureLod(uSource, vUv, 0.0).rgb * uCoefficients[0];
  int taps = int(max(uTapCount, 1.0));
  for (int tap = 1; tap < 24; tap++) {
    if (tap >= taps) break;
    vec2 offset = uDirection * uTexelSize * float(tap);
    float w = uCoefficients[tap];
    color += (textureLod(uSource, vUv + offset, 0.0).rgb
            + textureLod(uSource, vUv - offset, 0.0).rgb) * w;
  }
  fragColor = vec4(max(color, vec3(0.0)), 1.0);
}`;

const PRESENT_FS = `#version 300 es

  // weighted by 1/(1+luma), so ultra-bright subpixel highlights average down

  vec2 edge = e - s; vec2 o = p - s;

  float sPhase = hash11(id * 13.207 + 41.0);

}

function blurPass(level, dirH, sourceTex) {
  const targetSet = bloomT[level];
  const dst = dirH ? targetSet.h : targetSet.v;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo);
  gl.viewport(0, 0, dst.w, dst.h);
  gl.useProgram(progBlur.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sourceTex);
  gl.uniform1i(progBlur.u.uSource, 0);
  gl.uniform2f(progBlur.u.uDirection, dirH ? 1 : 0, dirH ? 0 : 1);
  gl.uniform2f(progBlur.u.uTexelSize, 1 / dst.w, 1 / dst.h);
  gl.uniform1f(progBlur.u.uTapCount, BLOOM_KERNEL_TAPS[level]);
  gl.uniform1fv(progBlur.u.uCoefficients, BLOOM_WEIGHTS[level]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ---------------------------------------------------------------------------
// Frame loop
// ---------------------------------------------------------------------------
function frame(nowMs) {
  requestAnimationFrame(frame);
  const now = nowMs / 1000;
  if (state.startTime === undefined) state.startTime = now;
  const elapsed = (now - state.startTime) % REVEAL_CYCLE;   // looping timeline
  // On cycle wrap (during the beat of black), reset the held rotation and
  // beam aim so the new pass starts from neutral instead of visibly
  // un-winding the pose the charge-back froze.
  if (elapsed < state.prevElapsed) {
    state.orbit = [0, 0];
    state.orbitGoal = [0, 0];
    state.aim = [0.5, 0.5];
    state.lightDirty = true;
  }
  state.prevElapsed = elapsed;

  // Resize
  const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (w !== width || h !== height) {
    width = w; height = h;
    canvas.width = w; canvas.height = h;
    state.aspect = w / h;
    resizeTargets(w, h);
    state.lightDirty = true;
  }

  // Scripted landing animation: the beam holds its hero pose while the prism
  // takes a very slight, slow horizontal rotation with a hint of breathing in
  // the beam's incidence — no pointer interaction.
  // Camera sway only — the beam aim stays fixed so the light mesh is never
  // rebuilt for idle motion (rebuilds caused visible frame hitches).
  // The slight rotation continues through the whole cycle — including while
  // the camera charges back — following the same forward sweep (it never
  // snaps back to center).
  {
    // Steady rotation about the vertical axis for the whole visible run — a
    // constant-rate yaw drift (a sine stalls at its peak, which read as the
    // rotation stopping), with a whisper of pitch breath on top.
    const yaw = (elapsed / 4.7) * 1.45;   // 0 -> +20deg, constant rate, no start lurch
    // During the dive the rotation CONTINUES and accelerates: the prism swings
    // around to present its side, and the camera passes through the side face
    // (~+80deg total by entry). Quintic, so the swing blends seamlessly out of
    // the idle drift.
    const dq = clamp((elapsed - 3.4) / 2.0, 0, 1);
    const diveSwing = dq * dq * dq * (dq * (dq * 6 - 15) + 10);
    state.orbitGoal = [yaw + 3.0 * diveSwing,   // uncapped drift -> no stall
                       0.07 * Math.sin((elapsed / 9) * Math.PI + 1.2)];
    lerpToward(state.orbit, state.orbitGoal, CAMERA_ORBIT_LERP);

    // The optics respond to the rotation: as the prism turns, the beam's
    // incidence angle shifts, so the refraction and the fan's exit direction
    // genuinely change (re-traced through the glass). Rebuilds are thresholded
    // so they land only every few frames and never cause hitches.
    // Physical coupling: the beam's angle of incidence tracks the prism's
    // actual rotation angle (1 deg of turn -> 0.45 deg of incidence change,
    // uncapped), so the internal refraction and the fan re-solve through
    // Snell/Fresnel continuously while the prism turns.
    const orbitDeg = state.orbit[0] * CAMERA_ORBIT_DEGREES;
    const incidenceDeg = 60 - 0.45 * orbitDeg;
    const arcT = clamp((incidenceDeg + 35) / 190, 0.08, 0.92);
    const aimTarget = [arcT, 0.5 + 0.04 * Math.min(state.orbit[0], 1)];
    const dist = Math.hypot(aimTarget[0] - state.aim[0], aimTarget[1] - state.aim[1]);
    if (dist > 0.0008) {
      state.aim[0] += (aimTarget[0] - state.aim[0]) * LAMP_AIM_LERP;
      state.aim[1] += (aimTarget[1] - state.aim[1]) * LAMP_AIM_LERP;
      state.lightDirty = true;
    }
  }

  const reveal = heroRevealProgress(elapsed);
  // Camera pull-back: stay centered on the prism and charge backward.
  const ap = reveal.approach;
  const camDistance = CAMERA_DISTANCE + (DIVE_END_DISTANCE - CAMERA_DISTANCE) * ap;
  const prismMidZ = (PRISM_BACK_Z + PRISM_FRONT_Z) / 2;
  const camera = cameraView(state.aspect, state.orbit[0], state.orbit[1], [0, 0, prismMidZ * ap], camDistance);

  // Coarse threshold: dispersion rebuilds land every few frames instead of
  // every frame, and stop entirely before the camera charge begins.
  if (Math.abs(reveal.dispersion - state.dispersionMix) > 0.004 ||
      (reveal.dispersion >= 1 && state.dispersionMix < 1)) {
    state.dispersionMix = reveal.dispersion;
    setDispersionProgress(reveal.dispersion);
    state.lightDirty = true;
  }
  if (state.lightDirty) rebuildLightMesh();

  gl.disable(gl.DEPTH_TEST);

  // --- Background HDR: black wall + glass back interface + light sheet ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, backgroundT.msaaFbo || backgroundT.fbo);
  gl.viewport(0, 0, backgroundT.w, backgroundT.h);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);       // premultiplied
  gl.useProgram(progGlassBack.p);
  bindGlassUniforms(progGlassBack, camera);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, envTex);
  gl.uniform1i(progGlassBack.u.uEnvironment, 0);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.FRONT);
  gl.bindVertexArray(prismVao);
  gl.drawElements(gl.TRIANGLES, prismIndexCount, gl.UNSIGNED_SHORT, 0);
  gl.disable(gl.CULL_FACE);

  // UI plane inside the glass: it materializes at the prism's core during
  // the dive and is REFRACTED by the front interface like everything else.
  const uiEmit = (uiTexReady ? clamp((reveal.charge - 0.12) / 0.5, 0, 1) : 0) * (1 - (state.uiHandoff || 0));
  if (uiTexReady && (uiEmit > 0.001 || reveal.charge > 0.05)) {
    const fw = norm3([-camera.position[0], -camera.position[1], prismMidZ - camera.position[2]]);
    const right = norm3(cross3(fw, [0, 1, 0]));
    const up = cross3(right, fw);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progUiPlane.p);
    gl.uniformMatrix4fv(progUiPlane.u.uViewProjection, false, camera.viewProjection);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, uiTex);
    gl.uniform1i(progUiPlane.u.uTex, 0);
    gl.bindVertexArray(emptyVao);
    const drawPlane = (center, tilt, halfW, emit) => {
      if (emit <= 0.002) return;
      const cT = Math.cos(tilt), sT = Math.sin(tilt);
      const r = [right[0] * cT + up[0] * sT, right[1] * cT + up[1] * sT, right[2] * cT + up[2] * sT];
      const u2 = [up[0] * cT - right[0] * sT, up[1] * cT - right[1] * sT, up[2] * cT - right[2] * sT];
      const halfH = halfW * 0.60;
      gl.uniform3f(progUiPlane.u.uCenter, center[0], center[1], center[2]);
      gl.uniform3f(progUiPlane.u.uRight, r[0] * halfW, r[1] * halfW, r[2] * halfW);
      gl.uniform3f(progUiPlane.u.uUp, u2[0] * halfH, u2[1] * halfH, u2[2] * halfH);
      gl.uniform1f(progUiPlane.u.uEmit, emit);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    };
    const band = (a, b, c, d) => {
      const chg = reveal.charge;
      const inS = clamp((chg - a) / Math.max(b - a, 1e-4), 0, 1);
      const outS = clamp((chg - c) / Math.max(d - c, 1e-4), 0, 1);
      return (inS * inS * (3 - 2 * inS)) * (1 - outS * outS * (3 - 2 * outS));
    };
    // Peripheral glimpses: faint UI shards gliding past the frame's sides
    // during the zoom — a suggestion of what's coming. Each has its own
    // in/out window, offset and tilt, so they pass one after another.
    const off = (ox, oy, oz) => [
      right[0] * ox + up[0] * oy + fw[0] * oz,
      right[1] * ox + up[1] * oy + fw[1] * oz + 0,
      right[2] * ox + up[2] * oy + fw[2] * oz + prismMidZ,
    ];
    drawPlane(off(-0.38, 0.10, -0.05), 0.28, 0.13, 0.32 * band(0.10, 0.28, 0.45, 0.62));
    drawPlane(off(0.40, -0.14, 0.08), -0.22, 0.15, 0.30 * band(0.22, 0.40, 0.58, 0.74));
    drawPlane(off(-0.30, -0.24, 0.16), 0.14, 0.11, 0.28 * band(0.34, 0.52, 0.68, 0.84));
    // The main page at the prism's core
    drawPlane([0, 0, prismMidZ], 0, 0.30, uiEmit * (0.85 + 0.35 * reveal.charge));
  }

  gl.blendFunc(gl.ONE, gl.ONE);                       // additive light
  gl.useProgram(progLight.p);
  gl.uniformMatrix4fv(progLight.u.uViewProjection, false, camera.viewProjection);
  gl.uniform1f(progLight.u.uLightPlaneZ, PRISM_LIGHT_PLANE_Z);
  gl.uniform1f(progLight.u.uEdgeFalloff, LIGHT_FADE.edgeFalloff);
  gl.uniform1f(progLight.u.uOpacity, LIGHT_FADE.beamOpacity * reveal.lightDim);
  gl.uniform1f(progLight.u.uRainbowFalloffRate, LIGHT_FADE.rainbowFalloffRate);
  gl.uniform1f(progLight.u.uRainbowFalloffPower, LIGHT_FADE.rainbowFalloffPower);
  gl.uniform1f(progLight.u.uBeamWidthReveal, reveal.beamWidth);
  gl.uniform1f(progLight.u.uSweep, reveal.sweep);
  gl.bindVertexArray(lightVao);
  gl.drawArrays(gl.TRIANGLES, 0, LIGHT_VERTEX_COUNT);
  gl.disable(gl.BLEND);
  resolveTarget(backgroundT);

  // --- Scene HDR: copy background, then glass front interface ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, sceneT.msaaFbo || sceneT.fbo);
  gl.viewport(0, 0, sceneT.w, sceneT.h);
  gl.useProgram(progCopy.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, backgroundT.tex);
  gl.uniform1i(progCopy.u.uSource, 0);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(progGlassFront.p);
  bindGlassUniforms(progGlassFront, camera);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, envTex);
  gl.uniform1i(progGlassFront.u.uEnvironment, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, backgroundT.tex);
  gl.uniform1i(progGlassFront.u.uSceneTexture, 1);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.bindVertexArray(prismVao);
  gl.drawElements(gl.TRIANGLES, prismIndexCount, gl.UNSIGNED_SHORT, 0);
  gl.disable(gl.CULL_FACE);
  gl.bindVertexArray(emptyVao);
  resolveTarget(sceneT);

  // --- Bloom pyramid ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomT[0].v.fbo);
  gl.viewport(0, 0, bloomT[0].v.w, bloomT[0].v.h);
  gl.useProgram(progExtract.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
  gl.uniform1i(progExtract.u.uSource, 0);
  gl.uniform1f(progExtract.u.uThreshold, BLOOM.threshold);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  const particleLevel = bloomT[3];
  gl.bindFramebuffer(gl.FRAMEBUFFER, particleLevel.v.fbo);
  gl.viewport(0, 0, particleLevel.v.w, particleLevel.v.h);
  gl.useProgram(progParticleDown.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
  gl.uniform1i(progParticleDown.u.uSource, 0);
  gl.uniform2f(progParticleDown.u.uSourceTexelSize, 1 / sceneT.w, 1 / sceneT.h);
  gl.uniform2f(progParticleDown.u.uSourceToTargetScale, sceneT.w / particleLevel.v.w, sceneT.h / particleLevel.v.h);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  for (let level = 0; level < BLOOM_LEVELS; level++) {
    const src = level === 0 || level === 3 ? bloomT[level].v.tex : bloomT[level - 1].v.tex;
    blurPass(level, true, src);
    blurPass(level, false, bloomT[level].h.tex);
  }

  // Composite visible levels into bloomT[0].h
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomT[0].h.fbo);
  gl.viewport(0, 0, bloomT[0].h.w, bloomT[0].h.h);
  gl.useProgram(progComposite.p);
  for (let i = 0; i < 3; i++) {
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, bloomT[i].v.tex);
  }
  gl.uniform1i(progComposite.u.uLevel0, 0);
  gl.uniform1i(progComposite.u.uLevel1, 1);
  gl.uniform1i(progComposite.u.uLevel2, 2);
  gl.uniform1f(progComposite.u.uRadius, bloomSpread);
  gl.uniform3fv(progComposite.u.uFactors, BLOOM_LEVEL_FACTORS);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // --- Present: scene + bloom -> ACES -> sRGB ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, presentT.fbo);
  gl.viewport(0, 0, width, height);
  gl.useProgram(progPresent.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, sceneT.tex);
  gl.uniform1i(progPresent.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomT[0].h.tex);
  gl.uniform1i(progPresent.u.uBloom, 1);
  gl.uniform1f(progPresent.u.uBloomStrength, BLOOM.strength);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // --- Canvas: reveal mix + dust ---
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, width, height);
  gl.useProgram(progCopyReveal.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, presentT.tex);
  gl.uniform1i(progCopyReveal.u.uSource, 0);
  gl.uniform3f(progCopyReveal.u.uBackgroundColor, 0, 0, 0);
  gl.uniform1f(progCopyReveal.u.uRevealProgress, reveal.opacity);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // Final handoff: the real DOM page dissolves in only once the eye is
  // through the glass (the in-scene UI plane has already filled the frame),
  // so the swap is invisible.
  {
    // Hand off while the in-scene page still frames like the real one, and
    // trigger the staggered nav/heading/cards entrance.
    const h = clamp((reveal.charge - 0.8) / 0.1, 0, 1);
    const hs = h * h * (3 - 2 * h);
    homepageEl.style.opacity = reveal.fadeOut * hs;
    homepageEl.classList.toggle('show', hs > 0.02 && reveal.fadeOut > 0.5);
    homepageEl.style.clipPath = '';
    homepageEl.style.filter = '';
    state.uiHandoff = hs;
  }
  canvas.style.opacity = reveal.sceneFade;   // beams dissolve, UI remains

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(progDust.p);
  const wallExt = lightWallExtent(state.aspect);
  gl.uniformMatrix4fv(progDust.u.uViewProjection, false, camera.viewProjection);
  gl.uniform2f(progDust.u.uFieldHalfExtent, wallExt[0] / Math.min(2.5, Math.max(1, 1 / Math.max(state.aspect, 0.001))), wallExt[1] / Math.min(2.5, Math.max(1, 1 / Math.max(state.aspect, 0.001))));
  gl.uniform2f(progDust.u.uOutputSize, width, height);
  gl.uniform1f(progDust.u.uTime, Math.floor(30 * now) / 30);
  gl.uniform1f(progDust.u.uCameraDistance, CAMERA_DISTANCE);
  gl.uniform1f(progDust.u.uLightPlaneZ, PRISM_LIGHT_PLANE_Z);
  gl.uniform2fv(progDust.u.uPrismA, TRI.a);
  gl.uniform2fv(progDust.u.uPrismB, TRI.b);
  gl.uniform2fv(progDust.u.uPrismC, TRI.c);
  gl.uniform1f(progDust.u.uPrismFrontZ, PRISM_FRONT_Z);
  gl.uniform1f(progDust.u.uRevealProgress, reveal.opacity);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, bloomT[1].v.tex);
  gl.uniform1i(progDust.u.uColorTexture, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, bloomT[3].v.tex);
  gl.uniform1i(progDust.u.uLightTexture, 1);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, DUST_COUNT);

  // Faint ambient specks scattered through the surroundings.
  gl.useProgram(progAmbient.p);
  gl.uniformMatrix4fv(progAmbient.u.uViewProjection, false, camera.viewProjection);
  gl.uniform2f(progAmbient.u.uFieldHalfExtent,
    wallExt[0] / Math.min(2.5, Math.max(1, 1 / Math.max(state.aspect, 0.001))),
    wallExt[1] / Math.min(2.5, Math.max(1, 1 / Math.max(state.aspect, 0.001))));
  gl.uniform2f(progAmbient.u.uOutputSize, width, height);
  gl.uniform1f(progAmbient.u.uTime, now);
  gl.uniform1f(progAmbient.u.uLightPlaneZ, PRISM_LIGHT_PLANE_Z);
  gl.uniform1f(progAmbient.u.uReveal, reveal.opacity);
  gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, AMBIENT_COUNT);
  gl.disable(gl.BLEND);
}
requestAnimationFrame(frame);
</script>


</body>
</html>
